services:
  - type: web
    name: adaptive-incident-intelligence-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: INCIDENT_DATA_DIR
        value: /app/data
      - key: MEMORY_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ACTION_BACKEND
        value: simulation
      - key: LLM_PROVIDER
        value: none
      - key: API_CORS_ORIGINS
        sync: false
      - key: APPROVAL_IDENTITIES_JSON
        sync: false
